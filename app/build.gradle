plugins {
    id 'com.android.application'
}

// 正式签名凭据从根目录 keystore.properties 读取（该文件不入 git，指向仓库外的 keystore）；
// 没有该文件（如他人 clone / CI）时 release 产物退化为未签名，构建不失败
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'asia.carmix.market'
    compileSdk 35

    defaultConfig {
        applicationId 'asia.carmix.market'
        // 最低支持 Android 4.0 (API 14)：Conscrypt 2.5.2 官方同样支持 API 14
        minSdk 14
        // targetSdk 28：避免分区存储；>=23 保证 Android 14+ 允许侧载安装
        targetSdk 28
        versionCode 21
        versionName '1.13.0'
        // 资源只保留中文，裁掉依赖库携带的其他语言表（低配设备省内存省体积）
        resourceConfigurations += ['zh', 'zh-rCN']
    }

    buildFeatures {
        // 本项目未用到 AIDL/RenderScript/着色器，关闭以精简构建产物与任务链
        aidl false
        renderScript false
        shaders false
    }

    // 正式签名：见根目录 keystore.properties（勿提交）；debug 构建用本机默认调试密钥
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // OkHttp 3.12 是最后支持 API 9+ 的 LTS 线；4.x 需要 API 21+
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Conscrypt：让 Android 4.x 具备 TLS 1.2/1.3（Cloudflare 最低要求 TLS 1.2）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
