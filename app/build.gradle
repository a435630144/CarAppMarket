plugins {
    id 'com.android.application'
}

android {
    namespace 'asia.carmix.market'
    compileSdk 35

    defaultConfig {
        applicationId 'asia.carmix.market'
        // 最低支持 Android 4.0 (API 14)：Conscrypt 2.5.2 官方同样支持 API 14
        minSdk 14
        // targetSdk 28：避免分区存储；>=23 保证 Android 14+ 允许侧载安装
        targetSdk 28
        versionCode 10
        versionName '1.5.2'
    }

    // 用 debug 签名给 release 包签名，保证产物可直接安装；正式发布请替换为自己的 keystore
    signingConfigs {
        releaseDebugKey {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.releaseDebugKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // OkHttp 3.12 是最后支持 API 9+ 的 LTS 线；4.x 需要 API 21+
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Conscrypt：让 Android 4.x 具备 TLS 1.2/1.3（Cloudflare 最低要求 TLS 1.2）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
